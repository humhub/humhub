  <style>
    .sec { font-size: 12px; font-weight: 600; fill: #757575; letter-spacing: .06em; }
    .card { fill: #fff; stroke: #e5e5e5; }
    .title { font-size: 16px; font-weight: 600; fill: #000; }
    .empty { fill: #f5f5f5; stroke: #e5e5e5; }
