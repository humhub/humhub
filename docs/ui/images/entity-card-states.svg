    .lnk { font-size: 13px; font-weight: 600; fill: #555; }
    .chipt { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; }
    .note { font-size: 12px; fill: #037283; }
    .legend { font-size: 12.5px; fill: #333; }
    .num { font-size: 11px; font-weight: 700; fill: #fff; }
    .lead { stroke: #037283; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>
