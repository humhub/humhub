<text x="20" y="392" class="note">Tiles fill the width (at least 136 px each). On touch, every tile shows a ⋮ button for its menu.</text>
<text x="20" y="410" class="note">The path bar turns into a back arrow with the current folder's name.</text>
<text x="20" y="428" class="note">A long press selects the first item; then taps add to the selection.</text>
