<text x="24" y="626" class="legend">1  page toolbar: title and one primary action</text>
<text x="24" y="646" class="legend">2  filter bar; tags on cards set its filters</text>
<text x="24" y="666" class="legend">3  notice (optional)</text>
<text x="414" y="626" class="legend">4  grid: cells ≥ 264px, 16px gap, cards pop in staggered</text>
<text x="414" y="646" class="legend">5  next page: skeleton cards while it loads</text>
<text x="414" y="666" class="legend">6  next page loads on scroll; Show more for keyboard users</text>
<text x="20" y="710" class="sec">390 PX — ONE COLUMN</text>
<rect x="20" y="722" width="230" height="300" rx="18" fill="#ededed" stroke="#bdbdbd" stroke-width="2"/>
<rect x="28" y="732" width="214" height="84" rx="8" fill="#fff"/><text x="38" y="756" class="name" style="font-weight:600">Spaces Directory</text><rect x="200" y="738" width="32" height="32" rx="6" fill="#037283"/><use href="#i-plus" x="207" y="745" width="18" height="18" color="#fff"/><rect x="36" y="776" width="160" height="30" rx="6" class="empty"/><use href="#i-search" x="42" y="783" width="14" height="14" color="#757575"/><use href="#i-funnel" x="208" y="782" width="18" height="18" color="#333"/>
<rect x="28" y="824" width="214" height="188" rx="8" fill="#fff"/><rect x="36" y="832" width="198" height="70" rx="6" fill="#d9dde3"/><rect x="42" y="838" width="58" height="58" rx="5" fill="#5aa832"/><rect x="38" y="914" width="140" height="12" rx="4" fill="#ccc"/><rect x="38" y="936" width="180" height="8" rx="4" fill="#eee"/><rect x="38" y="970" width="194" height="30" rx="6" fill="#d5d5d5"/>
<text x="280" y="750" class="note">The grid fills its width with as many 264px columns as fit,</text>
<text x="280" y="770" class="note">down to one column on phones. Filters fold behind the funnel.</text>
<text x="280" y="790" class="note">Cards keep their full content on mobile; nothing is hidden.</text>
<text x="280" y="810" class="note"></text>
<text x="280" y="830" class="note">Empty: one message card across the grid (with Clear filters).</text>
<text x="280" y="850" class="note">Error: a message with Retry, in place of the grid or below</text>
<text x="280" y="870" class="note">the loaded cards.</text>
