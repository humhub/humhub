<svg xmlns="http://www.w3.org/2000/svg" width="800" height="530" viewBox="0 0 800 530" font-family="Open Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Data table: columns chooser and bulk selection</title>
  <defs>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M4 6 L8 10 L12 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M4 10 L8 6 L12 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-updown" viewBox="0 0 16 16"><path d="M5 6 L8 3 L11 6 M5 10 L8 13 L11 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path d="M6 4 L10 8 L6 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 4 L6 8 L10 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 2 V14 M2 8 H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-kebab" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="13" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-cols" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6 H14.5 M1.5 9.5 H14.5" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 16 16"><path d="M1.5 2.5 H14.5 L9.5 8.5 V13.5 L6.5 12 V8.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6 H14.5 M5 1 V4 M11 1 V4" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5 L6.5 11.5 L12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M4 8 H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 16 16"><path d="M10.5 2.5 L13.5 5.5 L5.5 13.5 H2.5 V10.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-person" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="3" fill="currentColor"/><path d="M2 15 Q2 9.5 8 9.5 Q14 9.5 14 15 Z" fill="currentColor"/></symbol>
    <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5 L9.5 6.5 M7 4.5 L8.5 3 A2.8 2.8 0 0 1 13 7.5 L11.5 9 M9 11.5 L7.5 13 A2.8 2.8 0 0 1 3 8.5 L4.5 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  </defs>
  <style>
    .sec { font-size: 12px; font-weight: 600; fill: #757575; letter-spacing: .06em; }
    .card { fill: #fff; stroke: #e5e5e5; }
    .title { font-size: 16px; font-weight: 600; fill: #000; }
    .empty { fill: #f5f5f5; stroke: #e5e5e5; }
    .filled { fill: #fff; stroke: #d5d5d5; }
    .ph { font-size: 14px; fill: #757575; }
    .val { font-size: 14px; fill: #000; }
    .th { font-size: 13px; font-weight: 600; fill: #555; }
    .th-on { font-size: 13px; font-weight: 600; fill: #000; }
    .name { font-size: 14px; font-weight: 500; fill: #000; }
    .sub { font-size: 12px; fill: #555; }
    .txt { font-size: 13px; fill: #333; }
    .lnk { font-size: 13px; font-weight: 600; fill: #555; }
    .chipt { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; }
    .note { font-size: 12px; fill: #037283; }
    .legend { font-size: 12.5px; fill: #333; }
    .num { font-size: 11px; font-weight: 700; fill: #fff; }
    .lead { stroke: #037283; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>
  <rect width="800" height="530" fill="#ededed"/>
<text x="20" y="28" class="sec">COLUMNS CHOOSER</text>
<rect x="20" y="40" width="370" height="390" rx="10" class="card"/>
<text x="40" y="74" class="title">Columns</text><use href="#i-x" x="352" y="60" width="18" height="18" color="#333"/>
<text x="40" y="100" class="sub">Choose up to 3 columns.</text>
<text x="40" y="136" class="val" style="fill:#000">Group</text>
<rect x="318" y="122" width="40" height="22" rx="11" fill="#037283"/><circle cx="347" cy="133" r="8" fill="#fff"/>
<text x="40" y="170" class="val" style="fill:#000">Source</text>
<rect x="318" y="156" width="40" height="22" rx="11" fill="#037283"/><circle cx="347" cy="167" r="8" fill="#fff"/>
<text x="40" y="204" class="val" style="fill:#000">Status</text>
<rect x="318" y="190" width="40" height="22" rx="11" fill="#037283"/><circle cx="347" cy="201" r="8" fill="#fff"/>
<text x="40" y="238" class="val" style="fill:#999">Last sign-in</text>
<rect x="318" y="224" width="40" height="22" rx="11" fill="#e0e0e0"/><circle cx="329" cy="235" r="8" fill="#fff"/>
<text x="40" y="272" class="val" style="fill:#999">Spaces</text>
<rect x="318" y="258" width="40" height="22" rx="11" fill="#e0e0e0"/><circle cx="329" cy="269" r="8" fill="#fff"/>
<text x="40" y="306" class="val" style="fill:#000">Bulk select</text>
<rect x="318" y="292" width="40" height="22" rx="11" fill="#037283"/><circle cx="347" cy="303" r="8" fill="#fff"/>
<text x="40" y="340" class="sub" font-style="italic">"Hidden at this width" marks a chosen column</text>
<text x="40" y="356" class="sub" font-style="italic">that currently folded into the expandable row.</text>
<rect x="200" y="300" width="0" height="0"/>
<rect x="196" y="378" width="86" height="34" rx="6" fill="#e5e5e5"/><text x="239" y="400" class="txt" text-anchor="middle">Reset</text>
<rect x="290" y="378" width="86" height="34" rx="6" fill="#2d3340"/><text x="333" y="400" class="txt" style="fill:#fff" text-anchor="middle">Save</text>
<text x="20" y="456" class="note">The limit keeps the row readable; off-switches lock at the limit.</text>
<text x="20" y="474" class="note">Reset only appears while the choice differs from the default.</text>
<text x="420" y="28" class="sec">BULK SELECTION</text>
<rect x="420" y="40" width="360" height="390" rx="10" class="card"/>
<text x="440" y="74" class="title">Users</text>
<rect x="700" y="56" width="62" height="34" rx="6" fill="#e6f1f3"/><text x="716" y="78" font-size="13" font-weight="700" fill="#037283">2</text><use href="#i-kebab" x="734" y="65" width="16" height="16" color="#037283"/>
<rect x="560" y="96" width="210" height="196" rx="8" fill="#fff" stroke="#d5d5d5"/>
<text x="578" y="120" class="txt" style="fill:#000">Disable 2 users</text>
<text x="578" y="144" class="txt" style="fill:#000">Add to group…</text>
<text x="578" y="168" class="txt" style="fill:#000">Export selection</text>
<rect x="570" y="182" width="190" height="1" fill="#e5e5e5"/>
<text x="578" y="200" class="txt" style="fill:#000">Select all 35</text>
<text x="578" y="224" class="txt" style="fill:#000">Clear selection</text>
<rect x="570" y="238" width="190" height="1" fill="#e5e5e5"/>
<text x="578" y="256" class="txt" style="fill:#b42225">Delete 2 users</text>
<rect x="440" y="110" width="18" height="18" rx="4" fill="#037283"/><use href="#i-minus" x="441" y="111" width="16" height="16" color="#fff"/>
<rect x="430" y="140" width="120" height="36" rx="6" fill="#eef5f6"/>
<rect x="440" y="149" width="18" height="18" rx="4" fill="#037283"/><use href="#i-check" x="441" y="150" width="16" height="16" color="#fff"/><rect x="468" y="153" width="70" height="10" rx="5" fill="#e5e5e5"/>
<rect x="430" y="180" width="120" height="36" rx="6" fill="#eef5f6"/>
<rect x="440" y="189" width="18" height="18" rx="4" fill="#037283"/><use href="#i-check" x="441" y="190" width="16" height="16" color="#fff"/><rect x="468" y="193" width="70" height="10" rx="5" fill="#e5e5e5"/>
<rect x="440" y="229" width="18" height="18" rx="4" fill="#fff" stroke="#9a9ea6" stroke-width="1.5"/><rect x="468" y="233" width="70" height="10" rx="5" fill="#e5e5e5"/>
<rect x="440" y="269" width="18" height="18" rx="4" fill="#fff" stroke="#9a9ea6" stroke-width="1.5"/><rect x="468" y="273" width="70" height="10" rx="5" fill="#e5e5e5"/>
<text x="420" y="456" class="note">Shift-click selects a range. The header checkbox</text>
<text x="420" y="474" class="note">covers the current page; "Select all 35" covers</text>
<text x="420" y="492" class="note">every row matching the filters. A screen reader</text>
<text x="420" y="510" class="note">announces "2 selected".</text>
</svg>
