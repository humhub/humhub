<svg xmlns="http://www.w3.org/2000/svg" width="800" height="750" viewBox="0 0 800 750" font-family="Open Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Settings page anatomy</title>
  <defs>
<symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4 H13.5 M6 4 V2.5 H10 V4 M4 4 L4.8 14 H11.2 L12 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="i-gear2" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2.4 1.6"/></symbol>
<symbol id="i-reset" viewBox="0 0 16 16"><path d="M3 8 A5 5 0 1 0 5 4 M3 2 V5.5 H6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="i-checkc" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5 8.2 L7.2 10.4 L11 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
<symbol id="i-spin" viewBox="0 0 16 16"><path d="M8 2 A6 6 0 1 1 2.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M4 6 L8 10 L12 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M4 10 L8 6 L12 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-updown" viewBox="0 0 16 16"><path d="M5 6 L8 3 L11 6 M5 10 L8 13 L11 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path d="M6 4 L10 8 L6 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 4 L6 8 L10 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 2 V14 M2 8 H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-kebab" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="13" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-cols" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6 H14.5 M1.5 9.5 H14.5" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 16 16"><path d="M1.5 2.5 H14.5 L9.5 8.5 V13.5 L6.5 12 V8.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6 H14.5 M5 1 V4 M11 1 V4" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5 L6.5 11.5 L12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M4 8 H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 16 16"><path d="M10.5 2.5 L13.5 5.5 L5.5 13.5 H2.5 V10.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-person" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="3" fill="currentColor"/><path d="M2 15 Q2 9.5 8 9.5 Q14 9.5 14 15 Z" fill="currentColor"/></symbol>
    <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5 L9.5 6.5 M7 4.5 L8.5 3 A2.8 2.8 0 0 1 13 7.5 L11.5 9 M9 11.5 L7.5 13 A2.8 2.8 0 0 1 3 8.5 L4.5 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  </defs>
  <style>
    .sec { font-size: 12px; font-weight: 600; fill: #757575; letter-spacing: .06em; }
    .card { fill: #fff; stroke: #e5e5e5; }
    .title { font-size: 16px; font-weight: 600; fill: #000; }
    .empty { fill: #f5f5f5; stroke: #e5e5e5; }
    .filled { fill: #fff; stroke: #d5d5d5; }
    .ph { font-size: 14px; fill: #757575; }
    .val { font-size: 14px; fill: #000; }
    .th { font-size: 13px; font-weight: 600; fill: #555; }
    .th-on { font-size: 13px; font-weight: 600; fill: #000; }
    .name { font-size: 14px; font-weight: 500; fill: #000; }
    .sub { font-size: 12px; fill: #555; }
    .txt { font-size: 13px; fill: #333; }
    .lnk { font-size: 13px; font-weight: 600; fill: #555; }
    .chipt { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; }
    .note { font-size: 12px; fill: #037283; }
    .legend { font-size: 12.5px; fill: #333; }
    .num { font-size: 11px; font-weight: 700; fill: #fff; }
    .lead { stroke: #037283; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>
  <rect width="800" height="750" fill="#ededed"/>
<rect x="20" y="20" width="760" height="620" rx="8" class="card"/>
<text x="40" y="58" class="title">Streams &amp; Posts</text>
<rect x="452" y="36" width="170" height="38" rx="6" fill="#d5d5d5"/><text x="537" y="60" font-size="14" text-anchor="middle" fill="#222">Reset for all users</text>
<rect x="630" y="36" width="38" height="38" rx="6" fill="#d5d5d5"/><use href="#i-reset" x="639.0" y="45.0" width="20" height="20" color="#222"/><rect x="676" y="36" width="38" height="38" rx="6" fill="#2d3340"/><use href="#i-check" x="685.0" y="45.0" width="20" height="20" color="#fff"/>
<rect x="36" y="88" width="728" height="410" rx="6" fill="#fdfdfd" stroke="#d5d5d5" stroke-dasharray="4 3"/>
<text x="52" y="120" class="name" style="font-weight:600">Streams</text><circle cx="124" cy="116" r="3.5" fill="#037283"/><use href="#i-down" x="732" y="106" width="18" height="18" color="#555"/>
<rect x="48" y="138" width="704" height="1" fill="#e5e5e5"/>
<text x="56" y="164" class="name">Dashboard order</text><rect x="56" y="172" width="688" height="38" rx="6" class="filled"/><text x="66" y="196" class="val">Newest first</text><use href="#i-down" x="720" y="183" width="16" height="16" color="#555"/><text x="56" y="228" class="sub">How the dashboard's stream is ordered.</text><text x="56" y="244" class="sub" font-size="11" style="fill:#757575">Default: Newest first</text>
<rect x="56" y="260" width="688" height="64" rx="6" fill="#fff" stroke="#e7e7e7"/><text x="68" y="280" class="name" style="fill:#000">Guest access</text><text x="68" y="298" class="sub">People without an account can see public content.</text><text x="68" y="314" class="sub" font-size="11" style="fill:#757575">Default: off</text><rect x="690" y="270" width="40" height="22" rx="11" fill="#037283"/><circle cx="719" cy="281" r="8" fill="#fff"/>
<path d="M64 328 V344 H80" stroke="#037283" fill="none" stroke-dasharray="3 3"/>
<text x="86" y="348" class="note" font-size="11.5">conditional control, shown because "Guest access" is on:</text>
<rect x="86" y="356" width="300" height="38" rx="6" class="filled"/><text x="96" y="380" class="val">Guests see: Public spaces only</text><use href="#i-down" x="362" y="367" width="16" height="16" color="#555"/>
<rect x="56" y="408" width="688" height="64" rx="6" fill="#fff" stroke="#e7e7e7"/><text x="68" y="428" class="name" style="fill:#000">Show archived content</text><text x="68" y="446" class="sub">Archived posts stay visible in the stream.</text><text x="68" y="462" class="sub" font-size="11" style="fill:#757575">Default: on</text><rect x="690" y="418" width="40" height="22" rx="11" fill="#037283"/><circle cx="719" cy="429" r="8" fill="#fff"/>
<rect x="36" y="508" width="728" height="50" rx="6" fill="#fdfdfd" stroke="#d5d5d5" stroke-dasharray="4 3"/><text x="52" y="539" class="name" style="font-weight:600">Posts</text><use href="#i-up" x="732" y="524" width="18" height="18" color="#555"/>
<rect x="36" y="568" width="728" height="36" rx="6" fill="#f8e1e1"/><text x="52" y="591" class="txt" style="fill:#b42225">Not saved: "Pagination size" must be between 1 and 200.</text>
<circle cx="30" cy="50" r="9" fill="#037283"/><text x="30" y="54" class="num" text-anchor="middle">1</text>
<circle cx="446" cy="36" r="9" fill="#037283"/><text x="446" y="40" class="num" text-anchor="middle">2</text>
<circle cx="714" cy="30" r="9" fill="#037283"/><text x="714" y="34" class="num" text-anchor="middle">3</text>
<circle cx="30" cy="116" r="9" fill="#037283"/><text x="30" y="120" class="num" text-anchor="middle">4</text>
<circle cx="46" cy="164" r="9" fill="#037283"/><text x="46" y="168" class="num" text-anchor="middle">5</text>
<circle cx="46" cy="274" r="9" fill="#037283"/><text x="46" y="278" class="num" text-anchor="middle">6</text>
<circle cx="30" cy="533" r="9" fill="#037283"/><text x="30" y="537" class="num" text-anchor="middle">7</text>
<circle cx="30" cy="584" r="9" fill="#037283"/><text x="30" y="588" class="num" text-anchor="middle">8</text>
<text x="24" y="666" class="legend">1  page title (the card's header)</text>
<text x="24" y="686" class="legend">2  page action: not a save (Send test e-mail, Reset for all users)</text>
<text x="24" y="706" class="legend">3  Reset and Save: shown only while they can act</text>
<text x="24" y="726" class="legend">4  group (accordion) · dot = unsaved changes in it</text>
<text x="414" y="666" class="legend">5  control: label, field, description, "Default: …"</text>
<text x="414" y="686" class="legend">6  switch row: title, description, default, switch on the right</text>
<text x="414" y="706" class="legend">7  one group open at a time; a changed group stays open</text>
<text x="414" y="726" class="legend">8  failed save: reason, the group stays marked</text>
</svg>
