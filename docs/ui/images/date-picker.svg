<text x="420" y="64" class="note">Type the date or pick it. Typing is masked to the</text>
<text x="420" y="84" class="note">user's date format; the stored value is ISO.</text>
<text x="420" y="104" class="note"></text>
<text x="420" y="124" class="note">Click the month title to pick a month, then a year.</text>
<text x="420" y="144" class="note">Bold = today, filled = selected, faded = other month.</text>
<text x="420" y="164" class="note">Days outside the allowed range are disabled.</text>
<text x="420" y="184" class="note"></text>
<text x="420" y="204" class="note">Keyboard: arrows move by day / week, Page Up/Down</text>
<text x="420" y="224" class="note">by month, Enter picks, Escape closes.</text>
<text x="420" y="244" class="note"></text>
<text x="420" y="264" class="note">Clearing is the field's ×, not a button in the calendar.</text>
