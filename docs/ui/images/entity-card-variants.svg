<text x="24" y="402" class="legend">1  cover: banner image, else plain grey; image 80px</text>
<text x="24" y="422" class="legend">2  stat pill: counts (friends / followers / members); opens the list</text>
<text x="24" y="442" class="legend">3  title (link) and subtitle</text>
<text x="24" y="462" class="legend">4  body: details or description, room for 3 lines</text>
<text x="414" y="402" class="legend">5  tags: up to 5; a click filters the directory</text>
<text x="414" y="422" class="legend">6  footer: actions, full width; icon-only actions are square</text>
<text x="414" y="442" class="legend">7  module: badges top right (featured ★, update ↑, type)</text>
