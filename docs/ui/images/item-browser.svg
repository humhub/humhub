<text x="36" y="304" class="legend">1  path bar: root icon, ancestors as links, current level as text</text>
<text x="36" y="324" class="legend">2  selection menu: count + actions for the selection</text>
<text x="36" y="344" class="legend">3  view switch: grid / list</text>
<text x="416" y="304" class="legend">4  drop target: a folder takes dragged items or files</text>
<text x="416" y="324" class="legend">5  selected: checkbox shows on hover, stays while selecting</text>
<text x="416" y="344" class="legend">6  uploading: progress traced round the tile</text>
