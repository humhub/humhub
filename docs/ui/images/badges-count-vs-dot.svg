<svg xmlns="http://www.w3.org/2000/svg" width="800" height="272" viewBox="0 0 800 272" font-family="Open Sans, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Count badge on the menu entry, dots on the tabs below it</title>
  <defs>
<symbol id="i-bell" viewBox="0 0 16 16"><path d="M4 11 V7 A4 4 0 0 1 12 7 V11 L13.5 12.5 H2.5 Z M6.5 14 H9.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="i-mail" viewBox="0 0 16 16"><rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2 4 L8 9 L14 4" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
<symbol id="i-people2" viewBox="0 0 16 16"><circle cx="6" cy="5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 14 Q1.5 9 6 9 Q10.5 9 10.5 14" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="11.5" cy="5.5" r="2" fill="none" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-puzzle" viewBox="0 0 16 16"><path d="M3 5 H6 A1.5 1.5 0 1 1 9 5 H12 V8 A1.5 1.5 0 1 1 12 11 V14 H3 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
<symbol id="i-star" viewBox="0 0 16 16"><path d="M8 1.5 L10 6 L14.8 6.3 L11.1 9.4 L12.3 14.2 L8 11.6 L3.7 14.2 L4.9 9.4 L1.2 6.3 L6 6 Z" fill="currentColor"/></symbol>
<symbol id="i-arrowup" viewBox="0 0 16 16"><path d="M8 13 V3 M4 7 L8 3 L12 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#037283"/></marker>
    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M11 11 L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M4 6 L8 10 L12 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M4 10 L8 6 L12 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-updown" viewBox="0 0 16 16"><path d="M5 6 L8 3 L11 6 M5 10 L8 13 L11 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 16 16"><path d="M6 4 L10 8 L6 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-left" viewBox="0 0 16 16"><path d="M10 4 L6 8 L10 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4 L12 12 M12 4 L4 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 2 V14 M2 8 H14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-kebab" viewBox="0 0 16 16"><circle cx="8" cy="3" r="1.5" fill="currentColor"/><circle cx="8" cy="8" r="1.5" fill="currentColor"/><circle cx="8" cy="13" r="1.5" fill="currentColor"/></symbol>
    <symbol id="i-cols" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6 H14.5 M1.5 9.5 H14.5" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-funnel" viewBox="0 0 16 16"><path d="M1.5 2.5 H14.5 L9.5 8.5 V13.5 L6.5 12 V8.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 6 H14.5 M5 1 V4 M11 1 V4" stroke="currentColor" stroke-width="1.3"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.5 L6.5 11.5 L12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 16 16"><path d="M4 8 H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 16 16"><path d="M10.5 2.5 L13.5 5.5 L5.5 13.5 H2.5 V10.5 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
    <symbol id="i-person" viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="3" fill="currentColor"/><path d="M2 15 Q2 9.5 8 9.5 Q14 9.5 14 15 Z" fill="currentColor"/></symbol>
    <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5 L9.5 6.5 M7 4.5 L8.5 3 A2.8 2.8 0 0 1 13 7.5 L11.5 9 M9 11.5 L7.5 13 A2.8 2.8 0 0 1 3 8.5 L4.5 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  </defs>
  <style>
    .sec { font-size: 12px; font-weight: 600; fill: #757575; letter-spacing: .06em; }
    .card { fill: #fff; stroke: #e5e5e5; }
    .title { font-size: 16px; font-weight: 600; fill: #000; }
    .empty { fill: #f5f5f5; stroke: #e5e5e5; }
    .filled { fill: #fff; stroke: #d5d5d5; }
    .ph { font-size: 14px; fill: #757575; }
    .val { font-size: 14px; fill: #000; }
    .th { font-size: 13px; font-weight: 600; fill: #555; }
    .th-on { font-size: 13px; font-weight: 600; fill: #000; }
    .name { font-size: 14px; font-weight: 500; fill: #000; }
    .sub { font-size: 12px; fill: #555; }
    .txt { font-size: 13px; fill: #333; }
    .lnk { font-size: 13px; font-weight: 600; fill: #555; }
    .chipt { font-size: 10.5px; font-weight: 600; letter-spacing: .03em; }
    .note { font-size: 12px; fill: #037283; }
    .legend { font-size: 12.5px; fill: #333; }
    .num { font-size: 11px; font-weight: 700; fill: #fff; }
    .lead { stroke: #037283; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>
  <rect width="800" height="272" fill="#ededed"/>
<text x="20" y="28" class="sec">THE NUMBER LIVES ON THE MENU ENTRY; THE PAGES BELOW IT ONLY SHOW A DOT</text>
<rect x="20" y="40" width="250" height="168" rx="8" class="card"/><text x="36" y="70" class="title">Administration</text>
<rect x="32" y="86" width="226" height="36" rx="6" fill="#2d3340"/><use href="#i-people2" x="44" y="96" width="16" height="16" color="#fff"/><text x="68" y="109" class="txt" style="fill:#fff">People</text><rect x="226" y="93" width="22" height="22" rx="11" fill="#fbe4e4" stroke="#cc2629"/><text x="237.0" y="108" font-size="11.5" font-weight="700" style="fill:#a31f22" text-anchor="middle">7</text>
<rect x="32" y="128" width="226" height="36" rx="6" fill="#fff"/><use href="#i-puzzle" x="44" y="138" width="16" height="16" color="#333"/><text x="68" y="151" class="txt">Modules</text><rect x="226" y="135" width="22" height="22" rx="11" fill="#fbe4e4" stroke="#cc2629"/><text x="237.0" y="150" font-size="11.5" font-weight="700" style="fill:#a31f22" text-anchor="middle">3</text>
<path d="M262 104 C 300 104, 290 104, 318 104" stroke="#037283" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<rect x="324" y="40" width="456" height="120" rx="8" class="card"/><text x="340" y="70" class="title">People</text>
<rect x="340" y="88" width="72" height="40" rx="20" fill="#e9eaed" stroke="#9a9ea6" stroke-width="2"/><text x="356" y="113" class="txt" font-size="14">Users</text>
<rect x="420" y="88" width="132" height="40" rx="20" fill="#fff" stroke="#e2e2e2" stroke-width="2"/><text x="436" y="113" class="txt" font-size="14">Invitations</text>
<circle cx="536" cy="108" r="3.5" fill="#cc2629"/>
<rect x="560" y="88" width="116" height="40" rx="20" fill="#fff" stroke="#e2e2e2" stroke-width="2"/><text x="576" y="113" class="txt" font-size="14">Approvals</text>
<circle cx="660" cy="108" r="3.5" fill="#cc2629"/>
<rect x="684" y="88" width="80" height="40" rx="20" fill="#fff" stroke="#e2e2e2" stroke-width="2"/><text x="700" y="113" class="txt" font-size="14">Groups</text>
<text x="340" y="150" class="sub" font-size="11">7 = 4 invitations + 3 approvals. Screen readers hear "4 waiting" on the tab.</text>
<text x="20" y="236" class="note">One number per place: the entry that leads into a section sums up what waits inside it.</text>
<text x="20" y="254" class="note">Inside the section, dots only point to where it waits — the same number is never shown twice.</text>
</svg>
