<circle cx="440" cy="301" r="7" fill="#fff" stroke="#9a9ea6" stroke-width="1.5"/>
<text x="456" y="299" class="name" font-size="13" style="font-weight:600">Custom</text><text x="456" y="313" class="sub" font-size="11">Your own choice</text>
