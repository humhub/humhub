<text x="20" y="28" class="sec">SWITCH — A SETTING THAT IS ON OR OFF, APPLIES WHEN SAVED</text>
<rect x="20" y="40" width="760" height="92" rx="8" class="card"/>
<rect x="40" y="58" width="40" height="22" rx="11" fill="#c9ccd1" opacity="1"/><circle cx="51" cy="69" r="8" fill="#fff"/><text x="40" y="100" class="sub" font-size="11.5">off</text>
<rect x="140" y="58" width="40" height="22" rx="11" fill="#037283" opacity="1"/><circle cx="169" cy="69" r="8" fill="#fff"/><text x="140" y="100" class="sub" font-size="11.5">on</text>
<rect x="240" y="58" width="40" height="22" rx="11" fill="#e0e0e0" opacity="0.5"/><circle cx="251" cy="69" r="8" fill="#fff"/><text x="240" y="100" class="sub" font-size="11.5">disabled</text>
