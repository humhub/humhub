<rect x="36" y="202" width="18" height="18" rx="4" fill="#fff" stroke="#9a9ea6" stroke-width="1.5"/><text x="64" y="216" class="txt">Send me a copy</text>
<rect x="36" y="238" width="18" height="18" rx="4" fill="#037283"/><use href="#i-check" x="37" y="239" width="16" height="16" color="#fff"/><text x="64" y="252" class="txt">I accept the terms of use</text>
