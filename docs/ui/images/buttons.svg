<rect x="336" y="256" width="38" height="38" rx="6" fill="none"/><use href="#i-kebab" x="345.0" y="265.0" width="20" height="20" color="#555"/>
<text x="355" y="314" class="sub" font-size="11" text-anchor="middle">More actions</text>
<rect x="436" y="256" width="38" height="38" rx="6" fill="none"/><use href="#i-trash" x="445.0" y="265.0" width="20" height="20" color="#b42225"/>
<text x="455" y="314" class="sub" font-size="11" text-anchor="middle">Delete</text>
<rect x="540" y="252" width="104" height="26" rx="5" fill="#222"/><text x="592" y="270" font-size="12" fill="#fff" text-anchor="middle">Add user</text><path d="M586 278 L592 284 L598 278 Z" fill="#222"/><rect x="573" y="288" width="38" height="38" rx="6" fill="#037283"/><use href="#i-plus" x="582.0" y="297.0" width="20" height="20" color="#fff"/>
<text x="660" y="300" class="sub" font-size="11">tooltip on hover</text><text x="660" y="314" class="sub" font-size="11">and keyboard focus</text>
<text x="20" y="370" class="sec">FULL WIDTH — DIALOG FOOTERS AND CARD ACTIONS</text>
<rect x="20" y="382" width="370" height="70" rx="8" class="card"/>
<rect x="36" y="398" width="165" height="38" rx="6" fill="#d5d5d5"/><text x="118.5" y="422.0" font-size="14" font-weight="500" style="fill:#222" text-anchor="middle">Cancel</text><rect x="209" y="398" width="165" height="38" rx="6" fill="#2d3340"/><text x="291.5" y="422.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Save</text>
<text x="20" y="472" class="sub" font-size="11.5">buttons share the width equally; confirm on the right</text>
<text x="410" y="370" class="sec">CHOICE ROW — ONE OPTION IS CHOSEN</text>
<rect x="410" y="382" width="370" height="70" rx="8" class="card"/>
<rect x="426" y="398" width="108" height="38" rx="6" fill="#d5d5d5"/><text x="480.0" y="422.0" font-size="14" font-weight="500" style="fill:#222" text-anchor="middle">Attend</text><rect x="540" y="398" width="108" height="38" rx="6" fill="#037283"/><use href="#i-checkc" x="563.5" y="409.0" width="16" height="16" color="#fff"/><text x="604.0" y="422.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Maybe</text><rect x="654" y="398" width="110" height="38" rx="6" fill="#d5d5d5"/><text x="709.0" y="422.0" font-size="14" font-weight="500" style="fill:#222" text-anchor="middle">Decline</text>
<text x="410" y="472" class="sub" font-size="11.5">the chosen one is accent with a check (aria-pressed)</text>
<text x="20" y="510" class="sec">HEADER ACTIONS — HIDDEN UNTIL THEY CAN ACT</text>
<rect x="20" y="522" width="370" height="60" rx="8" class="card"/><text x="36" y="558" class="title">Settings</text>
<rect x="410" y="522" width="370" height="60" rx="8" class="card"/><text x="426" y="558" class="title">Settings</text><circle cx="500" cy="553" r="3.5" fill="#037283"/>
<rect x="680" y="533" width="38" height="38" rx="6" fill="#d5d5d5"/><use href="#i-reset" x="689.0" y="542.0" width="20" height="20" color="#222"/><rect x="726" y="533" width="38" height="38" rx="6" fill="#2d3340"/><use href="#i-check" x="735.0" y="542.0" width="20" height="20" color="#fff"/>
<path d="M300 552 H400" stroke="#037283" stroke-width="1.5" marker-end="url(#arr)"/><text x="306" y="544" class="note" font-size="11">after a change</text>
<text x="20" y="602" class="sub" font-size="11.5">Reset and Save slide in only when something changed. A button that cannot act is hidden, not disabled.</text>
<text x="20" y="640" class="sec">STATES</text>
<rect x="20" y="652" width="760" height="86" rx="8" class="card"/>
<rect x="36" y="668" width="128" height="38" rx="6" fill="#2d3340"/><text x="100.0" y="692.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Save</text>
<text x="36" y="728" class="sub" font-size="11.5">default</text>
<rect x="184" y="668" width="128" height="38" rx="6" fill="#2d3340" style="fill:#242934"/><text x="248.0" y="692.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Save</text>
<text x="184" y="728" class="sub" font-size="11.5">hover</text>
<rect x="328" y="664" width="136" height="46" rx="9" fill="none" stroke="#007aff" stroke-width="2"/>
<rect x="332" y="668" width="128" height="38" rx="6" fill="#2d3340"/><text x="396.0" y="692.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Save</text>
<text x="332" y="728" class="sub" font-size="11.5">keyboard focus</text>
<rect x="480" y="668" width="128" height="38" rx="6" fill="#2d3340"/><use href="#i-spin" x="506.1" y="679.0" width="16" height="16" color="#fff"/><text x="554.0" y="692.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Saving…</text>
<text x="480" y="728" class="sub" font-size="11.5">loading</text>
<rect x="628" y="668" width="128" height="38" rx="6" fill="#d7d7d7"/><text x="692.0" y="692.0" font-size="14" font-weight="500" style="fill:#9a9a9a" text-anchor="middle">Save</text>
<text x="628" y="728" class="sub" font-size="11.5">disabled (rare)</text>
