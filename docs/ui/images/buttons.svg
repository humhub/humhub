  <rect width="800" height="756" fill="#ededed"/>
<text x="20" y="28" class="sec">VARIANTS — EACH HAS ONE JOB</text>
<rect x="20" y="40" width="760" height="150" rx="8" class="card"/>
<rect x="36" y="60" width="128" height="38" rx="6" fill="#2d3340"/><text x="100.0" y="84.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Save</text>
<text x="36" y="118" class="name" style="font-weight:600">Primary</text>
<text x="36" y="136" class="sub" font-size="11.5">confirm a form or dialog</text>
<rect x="184" y="60" width="128" height="38" rx="6" fill="#037283"/><text x="248.0" y="84.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Create</text>
<text x="184" y="118" class="name" style="font-weight:600">Accent</text>
<text x="184" y="136" class="sub" font-size="11.5">create</text>
<text x="184" y="152" class="sub" font-size="11.5">the chosen option</text>
<rect x="332" y="60" width="128" height="38" rx="6" fill="#d5d5d5"/><text x="396.0" y="84.0" font-size="14" font-weight="500" style="fill:#222" text-anchor="middle">Cancel</text>
<text x="332" y="118" class="name" style="font-weight:600">Secondary</text>
<text x="332" y="136" class="sub" font-size="11.5">neutral, dismiss, reset</text>
<rect x="480" y="60" width="128" height="38" rx="6" fill="#cc2629"/><text x="544.0" y="84.0" font-size="14" font-weight="500" style="fill:#fff" text-anchor="middle">Delete</text>
<text x="480" y="118" class="name" style="font-weight:600">Danger</text>
<text x="480" y="136" class="sub" font-size="11.5">confirm a destructive step</text>
<rect x="628" y="60" width="128" height="38" rx="6" fill="none" stroke="#d5d5d5"/><text x="692.0" y="84.0" font-size="14" font-weight="500" style="fill:#555" text-anchor="middle">More</text>
<text x="628" y="118" class="name" style="font-weight:600">Ghost</text>
<text x="628" y="136" class="sub" font-size="11.5">quiet chrome in toolbars</text>
<text x="36" y="180" class="note">Ghost danger (red icon on hover fill) is the quiet form of Delete for rows and messages.</text>
<text x="20" y="226" class="sec">ICON BUTTONS — SQUARE 38 PX, LABEL AS TOOLTIP AND ACCESSIBLE NAME</text>
<rect x="20" y="238" width="760" height="96" rx="8" class="card"/>
<rect x="36" y="256" width="38" height="38" rx="6" fill="#d5d5d5"/><use href="#i-gear2" x="45.0" y="265.0" width="20" height="20" color="#222"/>
