<rect x="136" y="256" width="38" height="38" rx="6" fill="#037283"/><use href="#i-plus" x="145.0" y="265.0" width="20" height="20" color="#fff"/>
<text x="155" y="314" class="sub" font-size="11" text-anchor="middle">Add user</text>
<rect x="236" y="256" width="38" height="38" rx="6" fill="none"/><use href="#i-cols" x="245.0" y="265.0" width="20" height="20" color="#555"/>
