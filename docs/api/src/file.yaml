openapi: 3.0.0
info:
  description: |
    Welcome to the HumHub file API reference, v2.

    These endpoints are part of **HumHub core** (1.20+). The optional
    [REST API module](https://github.com/humhub/rest) contributes the token authentication
    methods they accept and owns the older `/api/v1` surface, which is documented with that
    module. For the design of this stack see `docs/develop/concept-api.md`.

    Conventions of this API generation, differing from `/api/v1`: camelCase field names,
    ISO-8601 timestamps with offset, plain HTTP status codes instead of a
    `{code, message}` envelope.

    **Uploading is a batch operation.** A single request carries any number of files, and the
    response reports the outcome per file — one rejected file never discards the accepted
    ones. That is the one documented deviation from the `422 {"errors": …}` validation
    contract of this API generation: a rejected file is a batch item, not an invalid field.

    **Files arrive unattached.** Nothing is bound to a record here: a client uploads, keeps
    the returned `guid`s and submits them with the form that owns them (`fileList` for a
    comment). Removing a file before saving is therefore purely client-side — the file stays
    unattached and the platform's own cron job cleans it up.

    Requests may authenticate with any token method the REST API module offers. HumHub's own
    browser session is accepted too for these endpoints, which is what the platform's Vue UI
    uses; state-changing session requests additionally require the CSRF token.
  version: 2.0.0
  title: HumHub - File API (v2)
  contact:
    email: info@humhub.com
  license:
    name: AGPLv2
    url: https://www.humhub.org/en/licences
servers:
  - url: /api/v2
security:
  - Bearer: []
  - BasicAuth: []
  - SessionCookie: []
paths:
  "/file":
    post:
      summary: Upload files
      description: |
        Stores the uploaded files for the authenticated caller. Same model, validation and
        image downscaling as the platform's own upload widget, so both paths produce identical
        files.

        The response carries the stored files in `results` and, per rejected file, its name and
        validation messages in `errors`. The status is `200` whenever the request carried at
        least one file — even if every single one was rejected. A request with no file at all
        is a malformed request and answers `422`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                "files[]":
                  type: array
                  description: The files to upload, repeated for a batch
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: |
            The request was processed; inspect `results` and `errors` for the per-file outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    description: The files that were stored
                    items:
                      $ref: "common.yaml#/components/schemas/File"
                  errors:
                    type: array
                    description: One entry per rejected file
                    items:
                      type: object
                      properties:
                        fileName:
                          type: string
                          description: |
                            The name as sent — not as stored, since the platform may rewrite a
                            file name — so a client can match the entry against what the user
                            picked.
                        messages:
                          type: array
                          items:
                            type: string
              example:
                results:
                  - id: 42
                    guid: 6e45b887-1cad-4209-a317-ffa5278c5a2f
                    mimeType: image/png
                    size: 20345
                    fileName: diagram.png
                    mimeIcon: mime-image
                    url: https://example.com/file/file/download?guid=6e45b887-1cad-4209-a317-ffa5278c5a2f&hash_sha1=1a2b3c4d
                    previewUrl: https://example.com/file/file/download?variant=preview-image&guid=6e45b887-1cad-4209-a317-ffa5278c5a2f&hash_sha1=1a2b3c4d
                errors:
                  - fileName: huge.zip
                    messages:
                      - The file "huge.zip" is too big. Its size cannot exceed 1 MB.
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "422":
          description: The request carried no file at all
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                example:
                  errors:
                    files:
                      - No file was uploaded.
  "/file/{id}":
    delete:
      summary: Delete a file
      description: |
        Deletes a file the caller is allowed to delete: an unattached file only its uploader
        may remove, an attached one everybody who may edit the record it belongs to. Files a
        module manages itself (`standalone`) are never deletable through this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          description: Id of the file
          schema:
            type: integer
      responses:
        "204":
          description: The file was deleted
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
components:
  securitySchemes:
    Bearer:
      $ref: "common.yaml#/components/securitySchemes/Bearer"
    BasicAuth:
      $ref: "common.yaml#/components/securitySchemes/BasicAuth"
    SessionCookie:
      $ref: "common.yaml#/components/securitySchemes/SessionCookie"
