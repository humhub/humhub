security:
  - Bearer: []
  - BasicAuth: []
  - SessionCookie: []
paths: {}
# The schemes the global `security` block names, from the shared components like every
# endpoint document declares them - `join` carries the block over from this file.
components:
  securitySchemes:
    Bearer:
      $ref: "common.yaml#/components/securitySchemes/Bearer"
    BasicAuth:
      $ref: "common.yaml#/components/securitySchemes/BasicAuth"
    SessionCookie:
      $ref: "common.yaml#/components/securitySchemes/SessionCookie"
