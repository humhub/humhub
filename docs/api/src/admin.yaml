openapi: 3.1.0
info:
  description: Joined into index.html by build.sh; this module's introduction is the
    description of its tag below.
  version: 2.0.0
  title: HumHub - Administration API (v2)
  contact:
    email: info@humhub.com
  license:
    name: AGPLv2
    url: https://www.humhub.org/en/licences
servers:
  - url: /api/v2
security:
  - Bearer: []
  - BasicAuth: []
  - SessionCookie: []
tags:
  - name: Administration
    description: |
      The administration's tables: users, groups, spaces and installed modules. The rows are
      those of the tables (Administration › Users, Groups, Spaces, Modules): table rows, not
      records — `{id, cells, actions}`, the cells as the table shows them and the actions the
      caller may take on each record (see `docs/ui/data-table.md`). Each list takes a search,
      its filters and a `sort` (a column's key, descending with a leading `-`) as query
      parameters; an unknown value or parameter answers `422`, and modules may add filters and
      columns of their own.
paths:
  "/admin/user":
    get:
      tags:
        - Administration
      summary: The rows of the user table
      operationId: listAdminUsers
      description: |
        One page of the platform's accounts, whatever their visibility: the active ones unless
        `status` says otherwise, searched, narrowed and ordered by the parameters below. An
        unknown value or parameter answers `422`; modules may add filters of their own, which
        are then accepted like these, and may narrow the list (e.g. to the groups a manager
        manages).
      parameters:
        - name: q
          in: query
          required: false
          description: Search over name, e-mail, username, or an exact user id
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: |
            `enabled` (default) · `deactivated` · `deleted` (soft-deleted accounts)
          schema:
            type: string
            enum: [enabled, deactivated, deleted]
        - name: group
          in: query
          required: false
          description: Only members of this group (its id)
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: |
            Only accounts of this user source (its id, e.g. `local`, `ldap`); for System
            Administrators only, like the source column
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: |
            `name` (last name, first name) · `email` · `lastLogin` · `createdAt` · `source` ·
            `status`, each descending
            with a leading `-` (`-lastLogin`); empty values last in both directions. Without,
            the newest account first.
          schema:
            type: string
            enum: [name, -name, email, -email, lastLogin, -lastLogin, createdAt, -createdAt, source, -source, status, -status]
        - $ref: "common.yaml#/components/parameters/pageParam"
        - $ref: "common.yaml#/components/parameters/pageSizeParam"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "common.yaml#/components/schemas/ListEnvelope"
                  - type: object
                    properties:
                      results:
                        type: array
                        items:
                          $ref: "#/components/schemas/TableRow"
              example:
                results:
                  - id: 7
                    cells:
                      name:
                        text: Jane Doe
                        subtitle: jane@example.com
                        image: https://example.com/uploads/profile_image/abc.jpg
                        url: https://example.com/u/jane/
                      groups:
                        - text: Users
                          value: "2"
                      lastLogin:
                        value: "2026-10-25T10:00:00+00:00"
                        text: Oct 25, 2026
                        title: Oct 25, 2026, 10:00:00 AM
                    actions:
                      - id: edit
                        url: https://example.com/admin/user/edit?id=7
                      - id: disable
                        url: https://example.com/api/v2/admin/user/7/disable
                total: 1
                page: 1
                pageSize: 25
                pages: 1
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/group":
    get:
      tags:
        - Administration
      summary: The rows of the group table
      operationId: listAdminGroups
      description: |
        One page of the groups, for those who may manage groups (`ManageGroups`), and for group
        managers the groups they manage. Without `sort`, the normal groups before the
        subgroups, each by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Search over name and description
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: |
            `normal` · `subgroup`
          schema:
            type: string
            enum: [normal, subgroup]
        - name: sort
          in: query
          required: false
          description: |
            `name` · `members` · `managers` · `type`, each descending with a leading `-`
          schema:
            type: string
            enum: [name, -name, members, -members, managers, -managers, type, -type]
        - $ref: "common.yaml#/components/parameters/pageParam"
        - $ref: "common.yaml#/components/parameters/pageSizeParam"
      responses:
        "200":
          $ref: "#/components/responses/TableRows"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/space":
    get:
      tags:
        - Administration
      summary: The rows of the space table
      operationId: listAdminSpaces
      description: |
        One page of the spaces, whatever their visibility, for those who may manage spaces
        (`ManageSpaces`). Without `sort`, the spaces' own sort order, then by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Search over name, description and the owner's name, username and e-mail
          schema:
            type: string
        - name: visibility
          in: query
          required: false
          description: |
            `public` (registered users or everyone) · `private`
          schema:
            type: string
            enum: [public, private]
        - name: status
          in: query
          required: false
          description: |
            `active` · `archived`
          schema:
            type: string
            enum: [active, archived]
        - name: sort
          in: query
          required: false
          description: |
            `name` · `members` · `owner` · `visibility` · `status` · `createdAt`, each
            descending with a leading `-`; empty values last in both directions
          schema:
            type: string
            enum: [name, -name, members, -members, owner, -owner, visibility, -visibility, status, -status, createdAt, -createdAt]
        - $ref: "common.yaml#/components/parameters/pageParam"
        - $ref: "common.yaml#/components/parameters/pageSizeParam"
      responses:
        "200":
          $ref: "#/components/responses/TableRows"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/module":
    get:
      tags:
        - Administration
      summary: The rows of the module table
      operationId: listAdminModules
      description: |
        One page of the installed modules (core modules left out), for those who may manage
        modules or settings (`ManageModules`, `ManageSettings`). A row's `id` is the module's
        id. An available update comes from the marketplace's cached module list. Without
        `sort`, the modules with an update first, then the enabled and the disabled ones, each
        by name.
      parameters:
        - name: q
          in: query
          required: false
          description: Search over name, description and id
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: |
            `enabled` · `disabled`
          schema:
            type: string
            enum: [enabled, disabled]
        - name: update
          in: query
          required: false
          description: |
            `available`: a newer compatible version in the marketplace
          schema:
            type: string
            enum: [available]
        - name: sort
          in: query
          required: false
          description: |
            `name` · `version` · `update` · `status`, each descending with a leading `-`
          schema:
            type: string
            enum: [name, -name, version, -version, update, -update, status, -status]
        - $ref: "common.yaml#/components/parameters/pageParam"
        - $ref: "common.yaml#/components/parameters/pageSizeParam"
      responses:
        "200":
          $ref: "#/components/responses/TableRows"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/user/{id}/enable":
    post:
      tags:
        - Administration
      summary: Enable a deactivated user
      operationId: enableAdminUser
      description: |
        Activates the account and answers its new row. Only where the row offers the action
        (a deactivated account the caller may manage), else `403`.
      parameters:
        - $ref: "#/components/parameters/userIdPathParam"
      responses:
        "200":
          $ref: "#/components/responses/RowChanged"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/user/{id}/disable":
    post:
      tags:
        - Administration
      summary: Deactivate a user
      operationId: disableAdminUser
      description: |
        Deactivates the account and answers its new row. Only where the row offers the action
        (an active account the caller may manage), else `403`.
      parameters:
        - $ref: "#/components/parameters/userIdPathParam"
      responses:
        "200":
          $ref: "#/components/responses/RowChanged"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "404":
          $ref: "common.yaml#/components/responses/NotFound"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/user/bulk/enable":
    post:
      tags:
        - Administration
      summary: Enable several users
      operationId: bulkEnableAdminUsers
      description: |
        Enables the selected users: `ids`, or `all` — every user of the list's filters, given as
        query parameters exactly as `GET /admin/user` takes them. Each user whose row offers
        "Enable" (a deactivated account the caller may manage) is changed, the others are skipped.
      requestBody:
        $ref: "#/components/requestBodies/BulkSelection"
      responses:
        "200":
          $ref: "#/components/responses/BulkDone"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
  "/admin/user/bulk/disable":
    post:
      tags:
        - Administration
      summary: Deactivate several users
      operationId: bulkDisableAdminUsers
      description: |
        Deactivates the selected users, as `/admin/user/bulk/enable` enables them: each user whose
        row offers "Disable" (an active account the caller may manage) is changed, the others are
        skipped.
      requestBody:
        $ref: "#/components/requestBodies/BulkSelection"
      responses:
        "200":
          $ref: "#/components/responses/BulkDone"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
components:
  parameters:
    userIdPathParam:
      name: id
      in: path
      description: Id of the user
      required: true
      schema:
        type: integer
  requestBodies:
    BulkSelection:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: "#/components/schemas/BulkSelection"
        application/json:
          schema:
            $ref: "#/components/schemas/BulkSelection"
  responses:
    TableRows:
      description: One page of the table's rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "common.yaml#/components/schemas/ListEnvelope"
              - type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/TableRow"
    BulkDone:
      description: How many users were changed and skipped
      content:
        application/json:
          schema:
            type: object
            properties:
              done:
                type: integer
              skipped:
                type: integer
              message:
                type: string
          example:
            done: 2
            skipped: 1
            message: 2 users were changed. 1 user was left out.
    RowChanged:
      description: The user's new row
      content:
        application/json:
          schema:
            type: object
            properties:
              row:
                $ref: "#/components/schemas/TableRow"
  schemas:
    BulkSelection:
      title: BulkSelection
      type: object
      description: The selected users — their `ids`, or `all` the users of the filters in the query
      properties:
        ids:
          type: array
          maxItems: 1000
          items:
            type: integer
        all:
          type: boolean
    TableRow:
      title: TableRow
      type: object
      description: |
        A row of a data table: the cells by column key — `{text, subtitle?, image?, url?}` for
        the main column (without an image, `initials` and `color` for a coloured tile instead),
        `[{text, value?}]` for a chip column, `{value, text, title}` for a date, `{text}`
        otherwise — and the actions the caller may take on it, each with its URL.
        The table's definitions (columns, actions) come with the page.
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
          description: The record's id; a module's id for the module table
        cells:
          type: object
          additionalProperties: true
        actions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              url:
                type: string
  securitySchemes:
    Bearer:
      $ref: "common.yaml#/components/securitySchemes/Bearer"
    BasicAuth:
      $ref: "common.yaml#/components/securitySchemes/BasicAuth"
    SessionCookie:
      $ref: "common.yaml#/components/securitySchemes/SessionCookie"
