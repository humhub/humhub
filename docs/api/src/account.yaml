openapi: 3.1.0
info:
  description: Joined into index.html by build.sh; this module's introduction is the
    description of its tag below.
  version: 2.0.0
  title: HumHub - Account API (v2)
  contact:
    email: info@humhub.com
  license:
    name: AGPLv2
    url: https://www.humhub.org/en/licences
servers:
  - url: /api/v2
security:
  - Bearer: []
  - BasicAuth: []
  - SessionCookie: []
tags:
  - name: Account
    description: |
      The authenticated user's own data — always the caller. There is no user parameter, and
      nothing here is reachable for a guest.
paths:
  "/account":
    get:
      tags:
        - Account
      summary: The authenticated user
      operationId: getAccount
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "common.yaml#/components/schemas/UserShort"
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  "/account/blocked-users":
    get:
      tags:
        - Account
      summary: Ids of the users the caller has blocked
      operationId: listBlockedUsers
      description: |
        Clients need this to reproduce the platform's blocked-author masking: payloads are
        always unmasked, since masking is a display concern rather than an access boundary.
        Empty when user blocking is disabled by an administrator.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: integer
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
  "/account/table/{id}":
    put:
      tags:
        - Account
      summary: Save the columns chosen for a data table
      operationId: saveTableColumns
      description: |
        What the caller chose in a data table's column chooser (e.g. the administration's user
        table, `admin-users`): the keys of the optional columns shown. A user setting, so the
        choice follows the caller across devices; the page mounting the table reads it back.
        `null` returns to the table's defaults. Keys the table does not have are ignored by it.
      parameters:
        - name: id
          in: path
          description: The table's id (lowercase letters, digits, `.` and `-`)
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                columns:
                  type: [array, 'null']
                  maxItems: 50
                  items:
                    type: string
            example:
              columns: [username, createdAt]
      responses:
        "200":
          description: The stored choice
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: [array, 'null']
                    items:
                      type: string
        "401":
          $ref: "common.yaml#/components/responses/Unauthorized"
        "403":
          $ref: "common.yaml#/components/responses/Forbidden"
        "422":
          $ref: "common.yaml#/components/responses/ValidationFailed"
components:
  securitySchemes:
    Bearer:
      $ref: "common.yaml#/components/securitySchemes/Bearer"
    BasicAuth:
      $ref: "common.yaml#/components/securitySchemes/BasicAuth"
    SessionCookie:
      $ref: "common.yaml#/components/securitySchemes/SessionCookie"
